baseURL: "https://sodappm.github.io/"
locale: "zh-cn"
defaultContentLanguage: "zh"
title: "苏打的blog"
theme: "PaperMod"

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
pygmentsUseClasses: true

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  title: "苏打的blog"
  description: "游戏引擎 / 物理仿真 / 数值方法"
  keywords: [游戏引擎, 物理引擎, 流体仿真, 数值方法, GPU, 图形学]
  DateFormat: "2006-01-02"
  defaultTheme: auto
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowToc: true
  TocOpen: false
  ShowRssButtonInSectionTermList: true
  math: true

  homeInfoParams:
    Title: "苏打的blog"
    Content: >
      游戏引擎 · 物理仿真 · 数值方法


      记录从计算物理到实时引擎的学习与开发过程。
      目前在写一个 2D 刚体物理引擎 [Flint2d](https://github.com/sodappm)。

  socialIcons:
    - name: github
      url: "https://github.com/sodappm"
    - name: rss
      url: "index.xml"

  assets:
    disableHLJS: true
    favicon: "/favicon.ico"

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    threshold: 0.4
    minMatchCharLength: 2
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: posts
      name: 文章
      url: /posts/
      weight: 10
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 20
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 30
    - identifier: search
      name: 搜索
      url: /search/
      weight: 40

outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)'], ['$', '$']]
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: false
    style: monokai
  tableOfContents:
    endLevel: 3
    startLevel: 2
